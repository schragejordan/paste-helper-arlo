<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Token paste</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; background: #fff; color: #111; }
  textarea { width: 100%; height: 120px; font-family: monospace; }
  button { margin-top: 12px; padding: 10px 18px; font-size: 16px; }
  #len { margin-top: 8px; color: #555; }
</style>
</head>
<body>
<h1>Paste the token below</h1>
<p>Click "Paste from clipboard" (allow the clipboard permission if prompted), check the character count, then click the download button. Report only the character count shown — never the value.</p>
<textarea id="t" autofocus placeholder="Token will appear here"></textarea>
<div id="len">Characters: 0</div>
<button id="p" type="button">Paste from clipboard</button>
<button id="d" type="button">Download token.txt</button>
<div id="err" style="color:#b00; margin-top:8px;"></div>
<script>
  var t = document.getElementById('t');
  var len = document.getElementById('len');
  function upd() { len.textContent = 'Characters: ' + t.value.trim().length; }
  t.addEventListener('input', upd);
  t.addEventListener('paste', function () { setTimeout(upd, 50); });
  document.getElementById('p').addEventListener('click', function () {
    navigator.clipboard.readText().then(function (v) {
      t.value = v.trim();
      upd();
    }).catch(function (e) {
      document.getElementById('err').textContent = 'Clipboard read failed: ' + e.message;
    });
  });
  document.getElementById('d').addEventListener('click', function () {
    var v = t.value.trim();
    var blob = new Blob([v], { type: 'text/plain' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'token.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
</script>
</body>
</html>
